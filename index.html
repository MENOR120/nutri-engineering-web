<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuidado Animal - FaunaVideos</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        img { width: 100%; border-radius: 10px; margin-bottom: 20px; }
        
        /* Animación para el título/logo superior */
        h2 {
            animation: flotar 3s ease-in-out infinite;
        }

        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* Estilos y animación para el botón */
        .btn { 
            display: block; 
            background-color: #25D366; 
            color: white; 
            padding: 15px; 
            text-decoration: none; 
            font-size: 18px; 
            font-weight: bold; 
            border-radius: 50px; 
            margin-top: 10px; 
            animation: latido 1.5s infinite;
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); box-shadow: 0 0 15px rgba(37, 211, 102, 0.5); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Guía de Primeros Auxilios</h2>
        <!-- Cambia 'tu-foto.jpg' por el nombre real de tu imagen -->
        <img src="tu-foto.webp" alt="Primeros Auxilios Mascotas">
        <p>Aprende a proteger a tu mascota en emergencias.</p>
        
        <!-- AQUÍ VA TU ENLACE DE WHATSAPP -->
        <a href="https://api.whatsapp.com/send?phone=573186632478&text=Hola,%20quiero%20info%20de%20la%20mascota" class="btn">
            Obtener Información
        </a>
    </div>
</body>
</html>
